services:
  - type: web
    name: logic-rush-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: CLIENT_URL
        value: https://client-gamma-ten-18.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: logic-rush-db
          property: connectionString

databases:
  - name: logic-rush-db
    databaseName: logicrush
    user: logicrush
    plan: free
